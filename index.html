<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Katmanlı organizasyon şeması düzenleyici: kutu ekle, bağla, yakınlaştır, kaydet ve paylaş.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='11' y='3' width='10' height='9' rx='2' fill='%232346C8'/%3E%3Crect x='3' y='20' width='10' height='9' rx='2' fill='%232346C8'/%3E%3Crect x='19' y='20' width='10' height='9' rx='2' fill='%232346C8'/%3E%3Cpath d='M16 12v4M8 20v-4h16v4' stroke='%232346C8' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<title>Kadro Şema Atölyesi</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="kd-css">
:root{
  --bg:#E6EBF0;--dot:#C3CDD8;--surface:#FFFFFF;--surface-2:#F3F5F8;--ink:#121A24;--muted:#566275;--faint:#8792A3;--line:#D2D9E2;--line-strong:#B9C3CF;
  --accent:#2346C8;--accent-2:#1B37A0;--accent-soft:#E2E8FB;--accent-ink:#FFFFFF;--link:#7A889B;
  --band-a:rgba(255,255,255,.62);--band-b:rgba(255,255,255,.22);--band-hl:rgba(35,70,200,.08);
  --danger:#B4233C;--danger-soft:#FBE6EA;--ok:#17714C;--ok-soft:#DFF3EA;--warn:#8A5F00;--warn-soft:#FAF0D6;
  --shadow:0 1px 2px rgba(18,26,36,.06),0 6px 18px rgba(18,26,36,.08);
  --shadow-lg:0 14px 44px rgba(18,26,36,.2);
  --f-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail-w:156px;--panel-w:308px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0F141B;--dot:#243040;--surface:#18202A;--surface-2:#1F2833;--ink:#E5EBF2;--muted:#9AA7B8;--faint:#6D7A8C;--line:#2B3644;--line-strong:#3A4757;
  --accent:#7593FF;--accent-2:#96ADFF;--accent-soft:#1E2A4D;--accent-ink:#0B1020;--link:#607086;
  --band-a:rgba(255,255,255,.04);--band-b:rgba(255,255,255,0);--band-hl:rgba(117,147,255,.12);
  --danger:#FF7D93;--danger-soft:#3A1C24;--ok:#5FD3A2;--ok-soft:#15332A;--warn:#F2C14E;--warn-soft:#3A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);--shadow-lg:0 14px 44px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0F141B;--dot:#243040;--surface:#18202A;--surface-2:#1F2833;--ink:#E5EBF2;--muted:#9AA7B8;--faint:#6D7A8C;--line:#2B3644;--line-strong:#3A4757;
  --accent:#7593FF;--accent-2:#96ADFF;--accent-soft:#1E2A4D;--accent-ink:#0B1020;--link:#607086;
  --band-a:rgba(255,255,255,.04);--band-b:rgba(255,255,255,0);--band-hl:rgba(117,147,255,.12);
  --danger:#FF7D93;--danger-soft:#3A1C24;--ok:#5FD3A2;--ok-soft:#15332A;--warn:#F2C14E;--warn-soft:#3A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);--shadow-lg:0 14px 44px rgba(0,0,0,.55)}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:4px}
.mark{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px}
.mark i{background:var(--accent);border-radius:2px}
.mark i:first-child{grid-column:1/3;width:50%;justify-self:center}
.titlebox{display:flex;align-items:center;gap:8px;flex:1 1 260px;min-width:0}
#chartName{flex:1 1 auto;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:-.01em}
#chartName:hover{border-color:var(--line)}
#chartName:focus{border-color:var(--accent);background:var(--surface-2);outline:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.live{background:var(--ok-soft);color:var(--ok)}
.pill.local{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
button.pill:hover{border-color:currentColor}
.savestate{font-size:12px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.savestate.dirty{color:var(--warn)}
.top-actions{display:flex;align-items:center;gap:6px;margin-left:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.icon{padding:7px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.block{width:100%;justify-content:flex-start}
#dirtyBadge{font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 6px;font-weight:500}
#dirtyBadge:empty{display:none}

/* work area */
.work{display:grid;grid-template-columns:1fr var(--panel-w);min-height:0}
.viewport{position:relative;overflow:hidden;min-width:0;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);cursor:default}
.viewport.panning{cursor:grabbing}
.board{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.band{position:absolute;height:150px;border-bottom:1px dashed var(--line)}
.band:nth-child(odd){background:var(--band-a)}
.band:nth-child(even){background:var(--band-b)}
.band.hl{background:var(--band-hl)}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#links path{fill:none}
#links .ln{stroke:var(--link);stroke-width:1.6}
#links .hit{stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
#links g:hover .ln{stroke:var(--ink)}
#links g.sel .ln{stroke:var(--accent);stroke-width:2.6}

.box{position:absolute;width:208px;height:84px;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.box:hover{border-color:var(--line-strong)}
.box.vac{border-style:dashed;border-color:var(--line-strong);box-shadow:none;background:var(--surface-2)}
.box.sel{outline:2px solid var(--accent);outline-offset:2px}
.box.src{outline:2px dashed var(--accent);outline-offset:3px}
.box.dragging{cursor:grabbing;box-shadow:var(--shadow-lg);z-index:3;opacity:.96}
.connecting .box{cursor:crosshair}
.ph{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--tone,var(--accent)) 14%,var(--surface));color:color-mix(in srgb,var(--tone,var(--accent)) 85%,var(--ink));font-weight:600;font-size:17px;letter-spacing:.02em;box-shadow:0 0 0 2px color-mix(in srgb,var(--tone,var(--line)) 45%,transparent)}
.box:not([style*="--tone"]) .ph{box-shadow:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tx{min-width:0;display:grid;gap:3px}
.pos{font-weight:600;font-size:13.5px;line-height:1.25;color:color-mix(in srgb,var(--tone,var(--ink)) 78%,var(--ink));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.per{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vac .per{font-style:italic;color:var(--faint)}
.addc{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0;opacity:0;transition:opacity .12s}
.box:hover .addc,.box.sel .addc{opacity:1}
.connecting .addc,.dragging .addc{display:none}

/* rail */
.rail{position:absolute;left:0;top:0;bottom:0;width:var(--rail-w);background:var(--surface);border-right:1px solid var(--line);z-index:2;overflow:hidden}
.rl{position:absolute;left:0;right:0;display:flex;align-items:stretch;border-bottom:1px dashed var(--line)}
.rl-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;border:0;background:transparent;padding:0 8px 0 14px}
.rl-main:hover{background:var(--surface-2)}
.rl.sel .rl-main{background:var(--accent-soft)}
.rl.sel .rl-k{color:var(--accent)}
.rl-k{font-family:var(--f-mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
.rl-n{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rl-c{font-size:11.5px;color:var(--muted)}
.rl.tight .rl-c,.rl.tight .rl-k{display:none}
.rl.tiny .rl-n{font-size:11px;-webkit-line-clamp:1}
.rl-add{align-self:center;margin-right:8px;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted);flex:none}
.rl-add:hover{color:var(--accent);border-color:var(--accent)}
.rl.tiny .rl-add{display:none}
.rl-new{position:absolute;left:10px;right:10px;border:1px dashed var(--line-strong);border-radius:8px;background:transparent;padding:7px;color:var(--muted);font-size:12.5px;font-weight:500}
.rl-new:hover{color:var(--accent);border-color:var(--accent)}

.tools{position:absolute;top:12px;left:calc(var(--rail-w) + 12px);display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:3;flex-wrap:wrap;max-width:calc(100% - var(--rail-w) - 24px)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:3}
.zoom .btn{padding:6px 8px}
#zPct{font-family:var(--f-mono);font-size:12px;min-width:54px}
.hint{position:absolute;top:64px;left:calc(var(--rail-w) + 12px);right:12px;margin-inline:auto;width:max-content;max-width:calc(100% - var(--rail-w) - 24px);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:10px;z-index:3;font-size:13px}
.empty{position:absolute;inset:0;left:var(--rail-w);display:grid;place-items:center;z-index:1;pointer-events:none}
.empty>div{pointer-events:auto;text-align:center;display:grid;gap:10px;justify-items:center;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-width:320px}
.empty h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:18px}
.empty p{margin:0;color:var(--muted)}

/* panel */
.panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding-block:16px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:18px;min-height:0}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.panel h2{margin:4px 0 0;font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.field{display:grid;gap:5px;font-size:12.5px;font-weight:500;color:var(--muted)}
.field input,.field select,.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:14px;font-weight:400;color:var(--ink)}
.field input:focus,.field select:focus,.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.group{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.panel>*{min-width:0;flex:none}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1 1 auto}
.photo-row{display:flex;gap:14px;align-items:center}
.photo-row .ph{width:72px;height:72px;font-size:22px;flex:none}
.photo-row .acts{display:grid;gap:6px;min-width:0}
.note{font-size:12px;color:var(--faint);margin:0}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;background:var(--c,var(--surface-2));position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sw.none::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2px;background:var(--faint);transform:rotate(-45deg)}
.conns{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.conns li{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.conns .dir{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;flex:none;width:30px}
.conns .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conns .btn{padding:4px 8px;font-size:12px}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{background:var(--surface);padding:10px 12px;display:grid;gap:2px}
.stats b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.keys{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:12.5px;color:var(--muted)}
.keys li{display:flex;justify-content:space-between;gap:12px}
kbd{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink);white-space:nowrap}
.linkcard{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px}
.linkcard .arrow{font-family:var(--f-mono);color:var(--faint);font-size:12px}
.panel-close{display:none}

/* drawer + modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.38);z-index:20;display:flex}
.sheet{background:var(--surface);width:min(440px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.sheet-head h2,.modal-card h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em}
.sheet-tools{display:grid;gap:10px;padding:8px 16px 12px;border-bottom:1px solid var(--line)}
.lib{list-style:none;margin:0;padding:8px;overflow:auto;flex:1;display:grid;align-content:start;gap:4px}
.lib li{display:flex;align-items:center;gap:6px;border-radius:10px;padding:4px 6px 4px 4px;border:1px solid transparent}
.lib li:hover{background:var(--surface-2)}
.lib li.cur{border-color:var(--accent);background:var(--accent-soft)}
.lib .open{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:8px 10px;display:grid;gap:3px;border-radius:8px}
.lib .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lib .unsaved{font-family:var(--f-mono);font-size:10.5px;color:var(--warn)}
.lib .btn{padding:6px}
.lib-empty{padding:24px 16px;color:var(--muted);text-align:center}
.modal-wrap{align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(500px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:18px}
.modal-card section{display:grid;gap:8px}
.modal-card h3{margin:0;font-size:14px;font-weight:600}
.modal-card p{margin:0;color:var(--muted);font-size:13px}
.codebox{display:flex;align-items:center;gap:8px}
.codebox code{flex:1;min-width:0;font-family:var(--f-mono);font-size:13px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;overflow-x:auto;white-space:nowrap;user-select:all}
.callout{padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40;max-width:calc(100% - 32px);width:max-content}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  :root{--panel-w:280px}
}
@media (max-width:760px){
  :root{--rail-w:92px}
  .work{grid-template-columns:1fr}
  .panel{position:fixed;left:0;right:0;bottom:0;max-height:58%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow-lg);z-index:10;transform:translateY(105%);transition:transform .2s;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .panel.open{transform:none}
  .panel-close{display:inline-flex}
  .tools .lbl,.top .lbl{display:none}
  .rl-main{padding-left:8px}
  .rl-add{display:none}
  .savestate{order:5;width:100%}
  .brand{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function linkPath(pa,pb){
  var t=pa,b=pb;if(pb.y<pa.y){t=pb;b=pa;}
  if(Math.abs(t.y-b.y)<1){var l=t.x<b.x?t:b,r=l===t?b:t,y=l.y+BOX_H/2;return 'M'+(l.x+BOX_W)+' '+y+' H'+r.x;}
  var x1=t.x+BOX_W/2,y1=t.y+BOX_H,x2=b.x+BOX_W/2,y2=b.y,my=y2-(BAND_H-BOX_H)/2;
  if(my<=y1+6)my=(y1+y2)/2;

  var rr=Math.min(8,Math.abs(x2-x1)/2),d=x2>x1?1:-1;
  return 'M'+x1+' '+y1+' V'+(my-rr)+' Q'+x1+' '+my+' '+(x1+d*rr)+' '+my+' H'+(x2-d*rr)+' Q'+x2+' '+my+' '+x2+' '+(my+rr)+' V'+y2;

function focusTitle(){setTimeout(function(){var f=document.getElementById('fTitle');if(f&&window.innerWidth>760){f.focus();f.select();}},30);}

/* ---------- view ---------- */
function railW(){return rail.getBoundingClientRect().width||0;}
function fit(){
  if(!cur)return;
  var r=vp.getBoundingClientRect(),rw=railW();
  var minX=0,maxX=BOX_W+PAD_X*2;
  if(cur.boxes.length){minX=Math.min.apply(null,cur.boxes.map(function(b){return b.x;}))-PAD_X;maxX=Math.max.apply(null,cur.boxes.map(function(b){return b.x+BOX_W;}))+PAD_X;}
  var bw=maxX-minX,bh=Math.max(1,cur.layers.length)*BAND_H;
  var aw=Math.max(120,r.width-rw-32),top=64,ah=Math.max(120,r.height-top-64);
  var z=clamp(Math.min(aw/bw,ah/bh,1.25),ZMIN,ZMAX);
  if(r.width<600)z=Math.max(z,0.5);
  view.z=z;view.x=rw+16+Math.max(0,(aw-bw*z)/2)-minX*z;view.y=top+Math.max(0,(ah-bh*z)/2);
  applyView();
}
function zoomAt(f,cx,cy){var nz=clamp(view.z*f,ZMIN,ZMAX);view.x=cx-(cx-view.x)*(nz/view.z);view.y=cy-(cy-view.y)*(nz/view.z);view.z=nz;applyView();}
function zoomCenter(f){var r=vp.getBoundingClientRect();zoomAt(f,r.width/2,r.height/2);}

/* ---------- gestures ---------- */
var gest=null,ptrs=new Map(),lastTap=null;
function vpPt(e){var r=vp.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function bandHl(ny){var i=Math.floor((ny+BOX_H/2)/BAND_H);bandsEl.querySelectorAll('.band').forEach(function(b,k){b.classList.toggle('hl',k===clamp(i,0,cur.layers.length-1));});}

vp.addEventListener('pointerdown',function(e){
  if(e.button>0)return;
  if(e.target.closest('.tools,.zoom,.rail,.hint,.empty>div,.addc'))return;
  ptrs.set(e.pointerId,vpPt(e));
  try{vp.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===2){var v=Array.from(ptrs.values());if(gest&&gest.type==='box'&&gest.moved)renderCanvas();gest={type:'pinch',d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1,z:view.z,vx:view.x,vy:view.y,mx:(v[0].x+v[1].x)/2,my:(v[0].y+v[1].y)/2};return;}
  var p=vpPt(e),bx=e.target.closest('.box'),lk=e.target.closest('[data-link]');
  if(bx){var b=findBox(bx.dataset.id),ps=boxPos(b);gest={type:'box',id:b.id,el:bx,sx:p.x,sy:p.y,ox:ps.x,oy:ps.y,nx:ps.x,ny:ps.y,moved:false};}
  else if(lk)gest={type:'link',id:lk.dataset.link,sx:p.x,sy:p.y,moved:false};
  else gest={type:'pan',sx:p.x,sy:p.y,vx:view.x,vy:view.y,moved:false};
});
vp.addEventListener('pointermove',function(e){
  if(!ptrs.has(e.pointerId)||!gest)return;
  var p=vpPt(e);ptrs.set(e.pointerId,p);
  if(gest.type==='pinch'){if(ptrs.size<2)return;var v=Array.from(ptrs.values()),d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),nz=clamp(gest.z*d/gest.d,ZMIN,ZMAX),mx=(v[0].x+v[1].x)/2,my=(v[0].y+v[1].y)/2;view.x=mx-(gest.mx-gest.vx)*(nz/gest.z);view.y=my-(gest.my-gest.vy)*(nz/gest.z);view.z=nz;applyView();return;}
  var dx=p.x-gest.sx,dy=p.y-gest.sy;
  if(!gest.moved&&Math.hypot(dx,dy)<4)return;
  if(gest.type==='box'&&connectMode)return;
  gest.moved=true;
  if(gest.type==='pan'){vp.classList.add('panning');view.x=gest.vx+dx;view.y=gest.vy+dy;applyView();}
  else if(gest.type==='box'){gest.nx=gest.ox+dx/view.z;gest.ny=gest.oy+dy/view.z;gest.el.style.left=gest.nx+'px';gest.el.style.top=gest.ny+'px';gest.el.classList.add('dragging');bandHl(gest.ny);drawLinks({id:gest.id,x:gest.nx,y:gest.ny});}
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  var g=gest;gest=null;vp.classList.remove('panning');
  if(!g||g.type==='pinch')return;
  if(e.type==='pointercancel'){if(g.type==='box'&&g.moved)renderCanvas();return;}
  var now=Date.now(),dbl=!g.moved&&lastTap&&lastTap.type===g.type&&lastTap.id===g.id&&now-lastTap.t<400&&Math.hypot(lastTap.x-g.sx,lastTap.y-g.sy)<12;
  lastTap=g.moved?null:{type:g.type,id:g.id,t:now,x:g.sx,y:g.sy};
  if(dbl)lastTap=null;
  if(g.type==='box'){bandHlClear();if(g.moved)dropBox(g.id,g.nx,g.ny);else if(dbl&&!connectMode){select({type:'box',id:g.id});focusTitle();}else boxClick(g.id);}
  else if(g.type==='link'){if(!g.moved)select({type:'link',id:g.id});}
  else if(!g.moved){
    if(dbl&&!connectMode&&cur.layers.length){var bx=(g.sx-view.x)/view.z,by=(g.sy-view.y)/view.z,bi=Math.floor(by/BAND_H);if(bi>=0&&bi<cur.layers.length){addBox(cur.layers[bi].id,bx-BOX_W/2);return;}}
    if(connectMode&&connectFrom){connectFrom=null;renderCanvas();}else if(sel)select(null);
  }
}
vp.addEventListener('pointerup',endPtr);vp.addEventListener('pointercancel',endPtr);
function boxClick(id){
  if(connectMode){if(!connectFrom){connectFrom=id;renderCanvas();}else if(connectFrom===id){connectFrom=null;renderCanvas();}else{var a=connectFrom;connectFrom=null;addLink(a,id);}return;}
  select({type:'box',id:id});
}
vp.addEventListener('wheel',function(e){
  e.preventDefault();var p=vpPt(e);
  if(e.ctrlKey||e.metaKey)zoomAt(Math.exp(-e.deltaY*0.0025),p.x,p.y);
  else{var k=e.deltaMode===1?16:1;view.x-=e.deltaX*k;view.y-=e.deltaY*k;applyView();}

vp.addEventListener('click',function(e){
  var a=e.target.closest('[data-addc]');if(a){e.stopPropagation();addChild(a.dataset.addc);return;}

      x.fillStyle='#8792A3';x.font='11px '+MONO;x.fillText('K'+(i+1),M,y+BAND_H/2-12);x.fillStyle='#121A24';x.font='600 13px '+UI;wrap(x,l.name,LABEL-M-16,2).forEach(function(t,k){x.fillText(t,M,y+BAND_H/2+6+k*17);});});

    x.save();x.translate(ox,oy);x.strokeStyle='#7A889B';x.lineWidth=1.6;
    var pos={};c.boxes.forEach(function(b){pos[b.id]=boxPos(b,idx);});
    c.links.forEach(function(l){var a=pos[l.from],b=pos[l.to];if(a&&b)x.stroke(new Path2D(linkPath(a,b)));});
    c.boxes.forEach(function(b){var p=pos[b.id];if(!p)return;var vac=!String(b.person||'').trim(),tone=toneHex(b.tone)||'#2346C8';
      x.save();x.shadowColor='rgba(18,26,36,.10)';x.shadowBlur=vac?0:10;x.shadowOffsetY=vac?0:3;rr(x,p.x,p.y,BOX_W,BOX_H,10);x.fillStyle=vac?'#F3F5F8':'#FFFFFF';x.fill();x.restore();
      rr(x,p.x,p.y,BOX_W,BOX_H,10);x.strokeStyle=vac?'#B9C3CF':'#D2D9E2';x.lineWidth=1;if(vac)x.setLineDash([4,3]);x.stroke();x.setLineDash([]);
      var cx=p.x+12+26,cy=p.y+BOX_H/2;
      x.save();x.beginPath();x.arc(cx,cy,26,0,Math.PI*2);x.closePath();x.fillStyle=tone+'24';x.fill();x.clip();
      if(imgs[b.id])x.drawImage(imgs[b.id],cx-26,cy-26,52,52);else{x.fillStyle=tone;x.font='600 17px '+UI;x.textAlign='center';x.textBaseline='middle';x.fillText(vac?'—':initials(b.person),cx,cy+1);}
      x.restore();x.textAlign='left';x.textBaseline='alphabetic';
      var tx=p.x+12+52+10,tw=BOX_W-(12+52+10)-12;
      x.font='600 13.5px '+UI;var tl=wrap(x,b.title||'Adsız pozisyon',tw,2);
      var total=tl.length*17+16,ty=p.y+(BOX_H-total)/2+13;
      x.fillStyle=toneHex(b.tone)||'#121A24';tl.forEach(function(t,k){x.fillText(t,tx,ty+k*17);});
      x.font=(vac?'italic ':'')+'12.5px '+UI;x.fillStyle=vac?'#8792A3':'#566275';x.fillText(wrap(x,vac?'Atanmadı':b.person,tw,1)[0]||'',tx,ty+tl.length*17+2);
    });
    x.restore();
    cv.toBlob(function(blob){if(blob)saveFile(slug(c.name)+'.png',blob);else toast('Görsel oluşturulamadı.');},'image/png');
  });
}

/* ---------- toast ---------- */
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},3200);}

/* ---------- boot ---------- */
(function boot(){
  var restore=ssGet(SS_KEY);ssDel(SS_KEY);
  var list=allCharts(),has=function(id){return id&&list.some(function(c){return c.id===id;});};
  var hash=(location.hash||'').replace(/^#c-/,'');
  var id=(restore&&has(restore.chartId)&&restore.chartId)||(has(hash)&&hash)||(has(lsGet(LAST_KEY))&&lsGet(LAST_KEY))||(list[0]&&list[0].id);
  if(!id){var c=blankChart();addChartLocal(c);id=c.id;}
  openChart(id,restore&&restore.chartId===id?restore.view:null);
  if(STANDALONE&&/^#s=/.test(location.hash||'')){var code=location.hash.slice(3);try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}
    decodeShare(code).then(function(d){if(!d||!d.chart)throw 0;var n=remapChart(d.chart);n.name=(d.chart.name||'Paylaşılan şema');addChartLocal(n);openChart(n.id);toast('Paylaşılan şema bu tarayıcıya eklendi.');}).catch(function(){toast('Paylaşım bağlantısı okunamadı. Bağlantının tamamını kopyaladığınızdan emin olun.');});}
  window.addEventListener('hashchange',function(){var h=(location.hash||'').replace(/^#c-/,'');if(h&&allCharts().some(function(c){return c.id===h;}))openChart(h);});
})();
})();
</script>
